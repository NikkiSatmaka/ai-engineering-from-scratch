[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]
llm = [
    "anthropic>=0.117.0",
    "openai>=2.46.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"

[dependency-groups]
jupyter-tools = [
    "catppuccin-jupyterlab>=0.2.5",
    "elyra>=3.15.0",
    "jupyterlab-git>=0.44.0",
    "jupyterlab-lsp>=4.3.0",
    "jupyterlab-vim>=0.16.0",
    "perspective>=1.0.3",
]

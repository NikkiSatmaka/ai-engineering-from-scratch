[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "polars[numpy,pandas,pyarrow,pydantic]>=1.43.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
torch-cpu = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]
torch-cu130 = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]
llm = [
    "anthropic>=0.117.0",
    "openai>=2.46.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "torch-cpu" },
    { extra = "torch-cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu130", extra = "torch-cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu130", extra = "torch-cu130" },

]
torchaudio = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu130", extra = "torch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
jupyter-tools = [
    "catppuccin-jupyterlab>=0.2.5",
    "elyra>=3.15.0",
    "jupyterlab-git>=0.44.0",
    "jupyterlab-lsp>=4.3.0",
    "jupyterlab-vim>=0.16.0",
    "perspective>=1.0.3",
]
